<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 560" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6b26b"/>
      <stop offset="0.55" stop-color="#c76b8f"/>
      <stop offset="1" stop-color="#5b3f8c"/>
    </linearGradient>

    <g id="photo">
      <rect width="420" height="400" fill="url(#sky)"/>
      <circle cx="300" cy="120" r="46" fill="#ffe2a8" opacity="0.9"/>
      <polygon points="0,290 90,190 170,260 250,170 340,250 420,200 420,400 0,400" fill="#3d2c5a"/>
      <polygon points="0,340 110,260 200,320 300,250 420,330 420,400 0,400" fill="#2b1f40"/>
    </g>

    <g id="card">
      <rect width="360" height="100" rx="10" fill="#1f2430" opacity="0.96"/>
      <rect x="14" y="15" width="70" height="70" rx="6" fill="#4a6fa5"/>
      <rect x="100" y="22" width="190" height="12" rx="4" fill="#e6e9ef"/>
      <rect x="100" y="46" width="230" height="8" rx="4" fill="#8b93a7"/>
      <rect x="100" y="62" width="210" height="8" rx="4" fill="#8b93a7"/>
      <rect x="100" y="78" width="140" height="8" rx="4" fill="#8b93a7"/>
    </g>

    <g id="content">
      <use xlink:href="#card" x="30" y="20"/>
      <use xlink:href="#card" x="30" y="140"/>
      <use xlink:href="#card" x="30" y="260"/>
      <use xlink:href="#card" x="30" y="380"/>
    </g>

    <g id="grid" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 4">
      <line x1="105" y1="0" x2="105" y2="400"/>
      <line x1="210" y1="0" x2="210" y2="400"/>
      <line x1="315" y1="0" x2="315" y2="400"/>
      <line x1="0" y1="100" x2="420" y2="100"/>
      <line x1="0" y1="200" x2="420" y2="200"/>
      <line x1="0" y1="300" x2="420" y2="300"/>
    </g>

    <clipPath id="viewport">
      <rect width="420" height="400" rx="8"/>
    </clipPath>

    <clipPath id="painted-tiles">
      <rect x="0" y="0" width="420" height="200"/>
      <rect x="0" y="200" width="210" height="100"/>
    </clipPath>
  </defs>

  <rect width="960" height="560" fill="#11141b"/>

  <text x="250" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#e6e9ef">Painted in time</text>
  <text x="250" y="74" text-anchor="middle" font-size="14" fill="#8b93a7">Every tile rastered before it reaches the viewport</text>

  <text x="710" y="50" text-anchor="middle" font-size="20" font-weight="600" fill="#e6e9ef">Scroll outruns raster</text>
  <text x="710" y="74" text-anchor="middle" font-size="14" fill="#8b93a7">Missing tiles expose the pinned photo</text>

  <g transform="translate(40 100)">
    <g clip-path="url(#viewport)">
      <use xlink:href="#photo"/>
      <use xlink:href="#content"/>
      <use xlink:href="#grid"/>
    </g>
    <rect width="420" height="400" rx="8" fill="none" stroke="#3a4152" stroke-width="2"/>
  </g>

  <g transform="translate(500 100)">
    <g clip-path="url(#viewport)">
      <use xlink:href="#photo"/>
      <g clip-path="url(#painted-tiles)">
        <use xlink:href="#content"/>
      </g>
      <use xlink:href="#grid"/>
      <g fill="none" stroke="#ff5c5c" stroke-width="2" stroke-dasharray="6 4">
        <rect x="211" y="201" width="208" height="98"/>
        <rect x="1" y="301" width="418" height="98"/>
      </g>
      <rect x="132" y="336" width="156" height="28" rx="14" fill="#11141b" opacity="0.85"/>
      <text x="210" y="355" text-anchor="middle" font-size="13" font-weight="600" fill="#ff8a8a">Tiles still rastering</text>
    </g>
    <rect width="420" height="400" rx="8" fill="none" stroke="#3a4152" stroke-width="2"/>
  </g>

  <g transform="translate(936 160)" fill="#8b93a7">
    <line x1="0" y1="0" x2="0" y2="250" stroke="#8b93a7" stroke-width="2"/>
    <polygon points="-7,240 7,240 0,258"/>
    <text x="14" y="125" font-size="12" text-anchor="middle" transform="rotate(90 14 125)">scroll</text>
  </g>

  <text x="480" y="536" text-anchor="middle" font-size="14" fill="#8b93a7">Dashed squares are raster tiles. Unpainted tiles show the layer beneath until raster catches up a frame or two later.</text>
</svg>
